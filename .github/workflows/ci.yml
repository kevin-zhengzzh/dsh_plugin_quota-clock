name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests (Node half smoke + i18n wiring + billing/timezone rules)
        run: npm test
      - name: Re-run billing rules under another local timezone
        run: TZ=America/New_York npm run test:time
        if: matrix.node-version == 20
